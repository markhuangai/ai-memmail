[package]
name = "ai-memmail-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ammonia = "=4.2.4"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["json"] }
chrono = "=0.4.45"
html2text = "=0.17.4"
# Upstream's first post-0.12.0 commit removes the unmaintained pin-utils dependency.
async-imap = { version = "=0.12.0", git = "https://github.com/chatmail/async-imap", rev = "d1f2606421c9211f992c1c565a32d8f770476aeb", default-features = false, features = ["runtime-tokio"] }
indexmap = "=2.14.2"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "native-tls", "pool", "smtp-transport"] }
mailparse = "=0.18.0"
native-tls = "=0.2.18"
openssl = { version = "=0.10.82", features = ["vendored"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
yaml_serde = "=0.10.7"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1"] }
postgres-protocol = "=0.6.12"
tower-http = { version = "=0.7.1", features = ["fs", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
ureq = { version = "=3.5.1", features = ["json"] }
uuid = { version = "=1.29.2", features = ["serde", "v4"] }

futures-util = { version = "=0.3.34", features = ["io"] }
futures-executor = "=0.3.34"
tokio-util = { version = "=0.7.20", features = ["compat"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
tower = "=0.5.3"
